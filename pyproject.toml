[project]
name = "trihub"
version = "0.1.0"
description = "Audit and operate your GitHub / Hugging Face / ModelScope portfolio from one place"
requires-python = ">=3.10"
dependencies = ["huggingface_hub", "modelscope", "requests"]

[project.scripts]
trihub = "trihub.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
